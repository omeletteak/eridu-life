<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>OGP 画像の元</title>
<!--
  OGP 画像（img/ogp.png、1200×630）の元。node tools/ogp.js で
  この画面を撮って書き出す。色は css/style.css の夜の色に合わせる。
  人生地図は飾り（1マス＝1年、紫は侵蝕度の高い年）。
-->
<link rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=DotGothic16&family=Zen+Kaku+Gothic+New:wght@500;700&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
  html,
  body {
    margin: 0;
    width: 1200px;
    height: 630px;
    background: #11141b;
    color: #e5e8ee;
    font-family: "Zen Kaku Gothic New", sans-serif;
  }
  .card {
    position: absolute;
    inset: 48px;
    background: #1a1f29;
    border: 2px solid #2d3442;
    border-top: 8px solid #e5e8ee;
    border-radius: 6px;
    padding: 44px 56px;
    box-sizing: border-box;
  }
  .eyebrow {
    font-family: "IBM Plex Mono", monospace;
    font-size: 22px;
    letter-spacing: 0.12em;
    color: #98a0af;
  }
  h1 {
    font-family: "DotGothic16", sans-serif;
    font-weight: 400;
    font-size: 96px;
    margin: 18px 0 14px;
    letter-spacing: 0.04em;
  }
  p {
    font-size: 30px;
    font-weight: 500;
    margin: 0;
    line-height: 1.6;
    color: #c9cfd8;
  }
  .map {
    position: absolute;
    left: 56px;
    bottom: 44px;
    display: grid;
    grid-template-columns: repeat(50, 14px);
    gap: 4px;
  }
  .map i {
    width: 14px;
    height: 14px;
    border-radius: 2px;
    background: #2d3442;
  }
  .map i.l {
    background: #e5e8ee;
    opacity: 0.75;
  }
  .map i.e {
    background: #a68eff;
  }
  .stamp {
    position: absolute;
    right: 56px;
    top: 40px;
    border: 4px solid #f0594e;
    color: #f0594e;
    font-weight: 700;
    font-size: 30px;
    padding: 6px 16px;
    border-radius: 6px;
    transform: rotate(-8deg);
  }
</style>
</head>
<body>
<div class="card">
  <div class="eyebrow">NEW ERIDU CIVIC RECORD · 非公式ファン作品</div>
  <h1>新エリー都の一生</h1>
  <p>ホロウと隣り合う都市に生まれ、<br>数年ごとの決断を選び、最期まで見届ける。</p>
  <div class="stamp">住民記録</div>
  <div class="map" id="map"></div>
</div>
<script>
  /* 人生地図の飾り。100マスのうち 73 年を生き、40〜52歳と 66〜72歳を紫に */
  const cells = [];
  for(let i = 0; i < 100; i++){
    let c = "";
    if( i < 73 ){
      c = (i >= 40 && i < 53) || i >= 66 ? "e" : "l";
    }
    cells.push(`<i class="${c}"></i>`);
  }
  document.getElementById("map").innerHTML = cells.join("");
</script>
</body>
</html>
