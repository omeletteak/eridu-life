# lab の道を共有する Worker の設定（docs/worker.md）。
# ダッシュボードの Git 連携で、main が更新されるとデプロイされる。
# name はダッシュボードの Worker の名前と同じにする。
name = "eridu-life"
main = "src/index.js"
compatibility_date = "2026-10-01"

# リポジトリのいちばん上を静的アセットとして配る（本編は /、lab は /lab/）。
# 配らないものはリポジトリの上の .assetsignore、応答のヘッダー（CSP）は
# _headers に書く。/api/ と /hello だけは先に Worker が受ける。
[assets]
directory = "../"
run_worker_first = ["/api/*", "/hello"]

# D1 のデータベース。Worker の中では env.DB で使う。
# database_id はダッシュボードの D1 の画面に出る Database ID。
[[d1_databases]]
binding = "DB"
database_name = "eridu-life"
database_id = "0bc438b1-e612-45f0-a337-47ba870d024c"

# born と died の回数を IP ごとに絞る（1分に 10 回まで）。Worker の中では
# env.LIMITER。namespace_id はこのアカウントの中で重ならない数ならよい。
[[ratelimits]]
name = "LIMITER"
namespace_id = "1001"
simple = {limit = 10, period = 60}

# PR ごとのプレビュー（Git 連携が wrangler preview で作る）の設定。
# D1 などのつなぎはここに書かないと引き継がれないので、プレビューには
# DB がない（API は 503 を返し、本番の表には書かない）。
[previews]
